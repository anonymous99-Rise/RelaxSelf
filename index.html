<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relaxself — 脚本批量安装</title>
  <style>
    :root {
      --bg: #0a0a0b;
      --card: #141416;
      --border: #222228;
      --text: #e4e4e7;
      --muted: #71717a;
      --accent: #f43f5e;
      --accent2: #10b981;
      --radius: 14px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 60px 20px;
    }
    .container { max-width: 780px; margin: 0 auto; }

    /* Hero */
    .hero { text-align: center; margin-bottom: 48px; }
    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px; height: 72px;
      background: linear-gradient(135deg, #f43f5e 0%, #fb923c 100%);
      border-radius: 20px;
      font-size: 36px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(244,63,94,0.3);
    }
    h1 { font-size: 36px; font-weight: 800; letter-spacing: -1px; margin-bottom: 10px; background: linear-gradient(135deg, #fff 0%, #a1a1aa 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero p { color: var(--muted); font-size: 16px; }

    /* Cards */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      border-color: #3a3a44;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .card-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      background: linear-gradient(135deg, #1e1e22 0%, #2a2a30 100%);
      border: 1px solid var(--border);
    }
    .card-body { flex: 1; min-width: 0; }
    .card-name { font-size: 15px; font-weight: 600; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-desc { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Install button */
    .install-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      padding: 7px 15px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.15s;
    }
    .install-btn:hover { background: #fb7185; transform: scale(1.05); }
    .install-btn:active { transform: scale(0.97); }

    /* CTA */
    .cta-section { margin-top: 32px; text-align: center; }
    .cta-label { font-size: 12px; color: var(--muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
    .cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #fff;
      text-decoration: none;
      padding: 14px 36px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      box-shadow: 0 4px 20px rgba(16,185,129,0.35);
      transition: all 0.2s;
    }
    .cta-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(16,185,129,0.45); }
    .cta-btn:active { transform: translateY(-1px); }

    /* Badge row */
    .badges { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: #1c1c20; border: 1px solid var(--border);
      border-radius: 20px; padding: 4px 12px;
      font-size: 12px; color: var(--muted);
    }
    .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent2); }

    /* Footer */
    .footer { text-align: center; margin-top: 56px; color: #3f3f46; font-size: 12px; }
    .footer a { color: #52525b; text-decoration: none; }
    .footer a:hover { color: var(--text); }

    /* Divider */
    .divider { height: 1px; background: var(--border); margin: 40px 0; }

    @media (max-width: 480px) {
      .grid { grid-template-columns: 1fr; }
      h1 { font-size: 28px; }
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="hero">
      <div class="logo">🍃</div>
      <h1>Relaxself</h1>
      <p>去广告 · 视频下载 · 油猴脚本合集</p>
    </div>

    <div class="badges">
      <span class="badge"><span class="badge-dot"></span>脚本猫专用</span>
      <span class="badge">🔥 持续更新</span>
      <span class="badge">🛡️ MIT 开源</span>
    </div>

    <div class="grid" id="scriptGrid"></div>

    <div class="cta-section">
      <div class="cta-label">使用脚本猫浏览器扩展？</div>
      <a class="cta-btn" id="installAll" href="#">
        🚀 一键安装全部脚本
      </a>
    </div>

    <div class="divider"></div>

    <div class="footer">
      <a href="https://github.com/anonymous99-Rise/RelaxSelf">GitHub</a> · MIT License · TreasureBoy99
    </div>
  </div>

  <script>
    const rawBase = 'https://raw.githubusercontent.com/anonymous99-Rise/RelaxSelf/main';
    const scripts = [
      { name: '18j去广告', desc: '去广告 + 悬浮下载 + 隐私保护', file: '18j去广告.js', icon: '🚫' },
      { name: '91去广告', desc: '91porna 全站去广告 + HLS 播放 + 悬浮下载', file: '91去广告.js', icon: '🎬' },
      { name: 'banana去广告+VIP', desc: '列表广告隐藏 + VIP 预览升级 + 叠层播放', file: 'banana去广告+VIP.js', icon: '🍌' },
      { name: 'javporn去广告', desc: 'BestJavPorn 去广告 + 原生播放修复', file: 'javporn去广告.js', icon: '🎥' },
      { name: 'Porn87去广告下载', desc: 'Porn87 去广告 + 视频下载', file: 'Porn87去广告下载.js', icon: '📥' },
      { name: 'skbj-vip-unlock', desc: 'SKBJ VIP/付费内容解锁', file: 'skbj-vip-unlock.user.js', icon: '🔓' },
      { name: '某角去广告', desc: '海角广告屏蔽 + m3u8 提取 + HLS 播放', file: '某角去广告.js', icon: '🏝️' },
      { name: '某肉去广告+下载', desc: 'rou.video 去广告 + 下载 + 隐私风险检测', file: '某肉去广告+下载.js', icon: '🥩' },
      { name: '糖心去广告+下载', desc: '糖心Vlog HLS 影片下载', file: '糖心去广告+下载.js', icon: '🍬' },
    ];

    const grid = document.getElementById('scriptGrid');

    scripts.forEach(s => {
      const url = `${rawBase}/${encodeURIComponent(s.file)}`;
      const installUrl = `scriptcat://install?url=${encodeURIComponent(url)}`;

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-icon">${s.icon}</div>
        <div class="card-body">
          <div class="card-name">${s.name}</div>
          <div class="card-desc">${s.desc}</div>
        </div>
        <a class="install-btn" href="${installUrl}">安装</a>
      `;
      grid.appendChild(card);
    });

    // One-click all — install first script; scriptcat will prompt for batch after
    const firstUrl = `${rawBase}/${encodeURIComponent(scripts[0].file)}`;
    document.getElementById('installAll').href =
      `scriptcat://install?url=${encodeURIComponent(firstUrl)}`;
  </script>
</body>
</html>

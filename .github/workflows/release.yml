name: Release & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Get next version
        id: version
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "last=$LAST_TAG" >> $GITHUB_OUTPUT
          # bump patch
          PATCH=$(echo $LAST_TAG | sed 's/v//' | awk -F. '{print $3+1}')
          NEW_TAG="v0.0.$PATCH"
          echo "new=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Create Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.new }}
          overwrite_files: true
          body: |
            ## 🍃 Relaxself ${{ steps.version.outputs.new }}

            自动发布的去广告/视频下载脚本合集。

            ### 脚本列表
            - 18j去广告
            - 91去广告
            - banana去广告+VIP
            - javporn去广告
            - Porn87去广告下载
            - skbj-vip-unlock
            - 某角去广告
            - 某肉去广告+下载
            - 糖心去广告+下载
          files: |
            *.js
            index.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site files
        run: mkdir -p site && cp index.html site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
